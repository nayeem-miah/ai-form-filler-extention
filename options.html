<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>AI Form Filler Assistant — Settings</title>
  <link rel="icon" href="icons/active-16.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="aiff-options-body">
  <main class="aiff-card">
    <header class="aiff-header">
      <div class="aiff-title-wrap">
        <h1>AI Form Filler</h1>
        <p class="aiff-subtitle">Gemini, OpenAI &amp; compatible APIs</p>
      </div>
      <button id="themeToggle" class="aiff-icon-btn" type="button" aria-label="Switch to dark mode" title="Toggle light / dark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </header>

    <label class="aiff-label" for="providerSelect">Provider</label>
    <select id="providerSelect" class="aiff-select">
      <option value="gemini">Google Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="custom">OpenAI Compatible / Custom</option>
    </select>

    <div id="customSection" hidden>
      <label class="aiff-label" for="apiBaseUrl">Base URL</label>
      <input
        id="apiBaseUrl"
        class="aiff-input"
        type="url"
        placeholder="https://openrouter.ai/api/v1"
        autocomplete="off"
        spellcheck="false"
      />

      <label class="aiff-label" for="customModel">Model</label>
      <input
        id="customModel"
        class="aiff-input"
        type="text"
        placeholder="deepseek/deepseek-chat"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <label class="aiff-label" for="apiKey" id="apiKeyLabel">API Key</label>
    <div class="aiff-input-wrap">
      <input
        id="apiKey"
        class="aiff-input"
        type="password"
        placeholder="sk-..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="toggleVisibility" class="aiff-eye-btn" type="button" aria-label="Show API key">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </div>

    <div id="modelRow">
      <label class="aiff-label" for="modelSelect" id="modelLabel">Model</label>
      <select id="modelSelect" class="aiff-select"></select>
    </div>

    <div class="aiff-actions">
      <button id="saveBtn" class="aiff-btn-primary" type="button">Save &amp; Test</button>
      <button id="clearBtn" class="aiff-btn-danger" type="button">Remove</button>
    </div>

    <p id="status" class="aiff-status" role="status" aria-live="polite"></p>

    <div class="aiff-row aiff-toggle-row">
      <div class="aiff-toggle-copy">
        <span class="aiff-toggle-title">Randomize values</span>
      </div>
      <button
        id="randomizeToggle"
        class="aiff-switch"
        type="button"
        role="switch"
        aria-checked="true"
        aria-label="Randomize generated values"
        title="Give different values on each run"
      ></button>
    </div>

    <div class="aiff-row aiff-update-row">
      <span class="aiff-update-label">Version</span>
      <button id="updateBtn" class="aiff-btn-ghost aiff-btn-sm" type="button">Check updates</button>
    </div>
    <p id="updateResult" class="aiff-update-result" role="status" aria-live="polite"></p>

    <footer class="aiff-footer">
      <a id="keyLink" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Get key</a>
      <span aria-hidden="true">·</span>
      <a id="modelsLink" href="https://ai.google.dev/gemini-api/docs/models" target="_blank" rel="noopener">Models</a>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
